<head><title>Slow-roasted tomato soup</title></head>
<body>
  <h1>Slow-roasted tomato soup</h1>
  <p>Halve one kilogram of ripe tomatoes and lay them on a tray with garlic and olive oil.</p>
  <p>Roast at 160 degrees for forty minutes until the edges begin to colour.</p>
  <p>Blend with warm stock, season to taste, and serve with bread.</p>

</body>
