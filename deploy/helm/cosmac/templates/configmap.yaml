apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cosmac.fullname" . }}-config
  labels:
    {{- include "cosmac.labels" . | nindent 4 }}
data:
  COSMAC_MODE: {{ .Values.config.mode | quote }}
  COSMAC_THRESHOLD: {{ .Values.config.threshold | quote }}
  COSMAC_DATA_DIR: {{ .Values.config.dataDir | quote }}
